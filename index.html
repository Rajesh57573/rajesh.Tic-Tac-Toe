<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main>
        <h1>Tic Tac Toe</h1>
        <div class="msg-container hide">
            <p>Winner</p>
        </div>
        <div class="container">
            <div class="game-box">
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
            </div>
            <div class="buttons">
                <button id="reset-btn" class="btns">Reset Game</button>
                <button id="new-btn" class="btns">New Game</button>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
